name = "footprint-postcard-api"
main = "api.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 启用 Workers 日志（Observability）
[observability]
enabled = true

# KV 命名空间绑定（从 Cloudflare 控制台获取 ID）
[[kv_namespaces]]
binding = "KV"
id = "b633c96885074ce2bf94f55ef52f2ed9"

# R2 存储桶绑定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "footprint-postcard"

# ============================================
# 以下环境变量需要在 Cloudflare 控制台后台设置：
# （Workers & Pages → 设置 → 变量 → 加密变量）
# 
# - JWT_SECRET: JWT 签名密钥
# - WECHAT_APP_ID: 微信小程序 AppID
# - WECHAT_APP_SECRET: 微信小程序 AppSecret
# - AMAP_KEY: 高德地图 Web 服务 API Key
# - N8N_WORKFLOW_URL: N8N 工作流 Webhook 地址
# - KUAI_API_KEY: kuai.host API Key
# - R2_PUBLIC_DOMAIN: R2 公开访问域名
# ============================================
